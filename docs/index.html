<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archiving the Present</title>
<meta name="description" content="Archiving the Present — a community network for archiving oral languages, memories, and knowledges, led by OpenSpeaks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #bdbaa1;
    --ink-red: #7a1b1b;
    --ink-blue: #12395c;
    --ink-dark: #2b2620;
    --ink-dark-soft: #4a4238;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    background-color: var(--paper);
    background-image: url("assets/paper-tile.jpg");
    background-repeat: repeat;
    background-size: 640px auto;
    color: var(--ink-dark);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 5vw 8vh;
    text-align: center;
  }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  main{
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 640px;
  }

  .card-wrap{
    position: relative;
    margin-bottom: 2.6rem;
  }

  .card{
    width: min(72vw, 420px);
    display: block;
    border-radius: 3px;
    transform: rotate(-3deg);
    box-shadow:
      0 2px 4px rgba(43,38,32,0.18),
      0 18px 34px -12px rgba(43,38,32,0.38),
      0 34px 60px -20px rgba(43,38,32,0.28);
    animation: float 7s ease-in-out infinite;
  }

  @keyframes float{
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(-3deg) translateY(-8px); }
  }

  .dot{
    position: absolute;
    border-radius: 50%;
    opacity: 0.85;
  }
  .dot.red   { width: 14px; height: 14px; background: var(--ink-red); }
  .dot.blue  { width: 10px; height: 10px; background: var(--ink-blue); }
  .dot.cream { width: 9px;  height: 9px;  background: #f4f1e6; border: 1px solid rgba(43,38,32,0.15); }

  .dot-a { top: -10px; right: 14%; }
  .dot-b { top: 6%; right: 5%; }
  .dot-c { bottom: -6px; left: 10%; }

  .tagline{
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: clamp(1.05rem, 2.6vw, 1.35rem);
    line-height: 1.4;
    color: var(--ink-dark);
    max-width: 30ch;
    margin: 0 0 1rem;
  }

  .credit{
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--ink-dark-soft);
    max-width: 42ch;
    margin: 0 0 2.4rem;
  }

  .credit .accent{
    color: var(--ink-red);
    font-weight: inherit;
  }

  .launch{
    display: inline-block;
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-blue);
    border: 1.5px solid var(--ink-blue);
    border-radius: 999px;
    padding: 0.55rem 1.3rem;
  }

  footer{
    margin-top: 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }

  .wordmark{
    width: 150px;
    height: auto;
    opacity: 0.9;
  }

  .domain{
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    color: var(--ink-dark-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; }
  }

  @media (max-width: 420px){
    .dot{ display: none; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="sr-only">Archiving the Present</h1>

    <div class="card-wrap">
      <span class="dot red dot-a"></span>
      <span class="dot blue dot-b"></span>
      <span class="dot cream dot-c"></span>
      <img class="card" src="assets/card.jpg" alt="Archiving the Present — a community guide to archiving languages, memories & knowledges, illustrated cover">
    </div>

    <p class="tagline">a community guide to archiving languages, memories &amp; knowledges</p>

    <p class="credit">An emerging network of language and memory keepers — led by <span class="accent">OpenSpeaks</span>.</p>

    <span class="launch">Launching 3 September 2026 &middot; Kochi</span>

    <footer>
      <img class="wordmark" src="assets/wordmark-red.png" alt="Archiving the Present">
      <span class="domain">archivingthepresent.cc</span>
    </footer>
  </main>
</body>
</html>
